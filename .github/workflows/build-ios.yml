name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # GA-версия: её iOS-биндинг рассчитан на Xcode 26.x (27.1 на раннере нет)
      - name: Setup .NET 10.0.100
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      # Ставим MAUI по манифестам из состава самого SDK, не обновляя их
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --skip-manifest-update

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          XCODE=/Applications/Xcode_26.6.app
          if [ ! -d "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "Using Xcode: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          # На образе нет ссылки MacOSX.sdk (только MacOSX26.5.sdk) — без неё не находится actool.
          # Создаём ссылку сами, если её нет.
          MSSDK="$XCODE/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          ls -la "$MSSDK" || true
          if [ -d "$MSSDK" ] && [ ! -e "$MSSDK/MacOSX.sdk" ]; then
            LATEST=$(ls -d "$MSSDK"/MacOSX*.sdk | sort -V | tail -1)
            echo "Linking MacOSX.sdk -> $LATEST"
            sudo ln -sfn "$LATEST" "$MSSDK/MacOSX.sdk"
          fi

      - name: Publish unsigned device build
        run: |
          dotnet publish Gorizont/Gorizont.csproj \
            -f net10.0-ios \
            -p:TargetFrameworks=net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:EnablePackageSigning=false \
            -p:MtouchLink=SdkOnly \
            -p:ValidateXcodeVersion=false

      - name: Collect IPA
        run: |
          IPA=$(find . -name "*.ipa" | head -n 1)
          echo "IPA found: $IPA"
          if [ -z "$IPA" ]; then
            echo "::error::No IPA found, dumping bin tree:"
            find Gorizont/bin -maxdepth 5 | head -60
            exit 1
          fi
          cp "$IPA" unsigned.ipa
          ls -lh unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gorizont-unsigned-ipa
          path: unsigned.ipa
